[package]
name = "osm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Session memory engine for Omarchy: tmux, workspace, and agent restore"
repository = "https://github.com/n8group-oss/omarchy-session-memory"

[[bin]]
name = "osm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
